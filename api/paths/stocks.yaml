get:
  tags:
    - stocks
  summary: 在庫一覧取得
  description: 在庫の一覧を取得します
  operationId: getStocks
  parameters:
    - $ref: "../components/parameters/common.yaml#/Offset"
    - $ref: "../components/parameters/common.yaml#/Limit"
    - $ref: "../components/schemas/stock.yaml#/StockCategoryQueryParameter"
    - $ref: "../components/schemas/stock.yaml#/StockSearchQueryParameter"
  responses:
    "200":
      description: 在庫一覧の取得に成功
      content:
        application/json:
          schema:
            $ref: "../components/schemas/stock.yaml#/ListStocksResponse"
    "400":
      $ref: "../components/responses/common.yaml#/BadRequest"
    "500":
      $ref: "../components/responses/common.yaml#/InternalServerError"
post:
  tags:
    - stocks
  summary: 在庫登録
  description: 在庫情報を登録します
  operationId: createStock
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas/stock.yaml#/CreateStockRequest"
  responses:
    "200":
      description: 在庫登録成功
      content:
        application/json:
          schema:
            $ref: "../components/schemas/stock.yaml#/StockDetail"
    "400":
      $ref: "../components/responses/common.yaml#/BadRequest"
    "500":
      $ref: "../components/responses/common.yaml#/InternalServerError"
