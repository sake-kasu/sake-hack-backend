get:
  tags:
    - Sakes
  summary: 酒詳細取得
  description: 酒の詳細情報を取得します
  operationId: getSakeDetail
  parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: 詳細情報を取得したい酒id
      - name: X-Like-Token
        in: header
        required: false
        schema:
          type: string
          maxLength: 255
        description: 匿名ユーザー識別用トークン(いいね状態判定用)
  responses:
    "200":
      description: 酒詳細の取得に成功
      content:
        application/json:
          schema:
            $ref: "../components/schemas/sake.yaml#/SakeDetail"
    "400":
      $ref: "../components/responses/common.yaml#/BadRequest"
    "404":
      $ref: "../components/responses/common.yaml#/NotFound"
    "500":
      $ref: "../components/responses/common.yaml#/InternalServerError"
