get:
  tags:
    - Sake
  summary: 酒詳細取得
  description: 酒の詳細情報を取得します
  operationId: listSakes
  parameters:
      - name: 酒ID
        in: path
        required: true
        schema:
          type: integer
          format: int32
        description: 詳細情報を取得したい酒id
  responses:
    "200":
      description: 酒一覧の取得に成功
      content:
        application/json:
          schema:
            $ref: "../components/schemas/sake.yaml#/SakeDetail"
    "400":
      $ref: "../components/responses/common.yaml#/BadRequest"
    "500":
      $ref: "../components/responses/common.yaml#/InternalServerError"
