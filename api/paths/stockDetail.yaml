get:
  tags:
    - Stocks
  summary: 酒詳細取得
  description: 酒の詳細情報を取得します
  operationId: getStockDetail
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int32
      description: 酒ID
  responses:
    "200":
      description: 酒詳細の取得に成功
      content:
        application/json:
          schema:
            $ref: "../components/schemas/sake.yaml#/SakeDetail"
    "400":
      $ref: "../components/responses/common.yaml#/BadRequest"
    "404":
      $ref: "../components/responses/common.yaml#/NotFound"
    "500":
      $ref: "../components/responses/common.yaml#/InternalServerError"

put:
  tags:
    - Stocks
  summary: 酒情報更新
  description: 既存の酒情報を更新します
  operationId: updateStock
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int32
      description: 酒ID
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas/sake.yaml#/UpdateSakeRequest"
  responses:
    "200":
      description: 酒情報の更新に成功
      content:
        application/json:
          schema:
            $ref: "../components/schemas/sake.yaml#/SakeDetail"
    "400":
      $ref: "../components/responses/common.yaml#/BadRequest"
    "404":
      $ref: "../components/responses/common.yaml#/NotFound"
    "500":
      $ref: "../components/responses/common.yaml#/InternalServerError"

delete:
  tags:
    - Stocks
  summary: 酒情報削除
  description: 指定された酒情報を削除します
  operationId: deleteStock
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int32
      description: 酒ID
  responses:
    "204":
      description: 酒情報の削除に成功
    "400":
      $ref: "../components/responses/common.yaml#/BadRequest"
    "404":
      $ref: "../components/responses/common.yaml#/NotFound"
    "500":
      $ref: "../components/responses/common.yaml#/InternalServerError"
