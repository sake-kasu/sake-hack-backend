get:
  tags:
    - Stocks
  summary: 在庫詳細取得
  description: 在庫の詳細情報を取得します
  operationId: getStockDetail
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int32
      description: 在庫ID
  responses:
    "200":
      description: 在庫詳細の取得に成功
      content:
        application/json:
          schema:
            $ref: "../components/schemas/sake.yaml#/SakeDetail"
    "400":
      $ref: "../components/responses/common.yaml#/BadRequest"
    "404":
      $ref: "../components/responses/common.yaml#/NotFound"
    "500":
      $ref: "../components/responses/common.yaml#/InternalServerError"

put:
  tags:
    - Stocks
  summary: 在庫情報更新
  description: 既存の在庫情報を更新します
  operationId: updateStock
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int32
      description: 在庫ID
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas/sake.yaml#/UpdateSakeRequest"
  responses:
    "200":
      description: 在庫情報の更新に成功
      content:
        application/json:
          schema:
            $ref: "../components/schemas/sake.yaml#/SakeDetail"
    "400":
      $ref: "../components/responses/common.yaml#/BadRequest"
    "404":
      $ref: "../components/responses/common.yaml#/NotFound"
    "500":
      $ref: "../components/responses/common.yaml#/InternalServerError"

patch:
  tags:
    - Stocks
  summary: 在庫部分更新
  description: 在庫情報を部分的に更新します(画像アップロード後のobjectKey設定等)
  operationId: patchStock
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int32
      description: 在庫ID
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas/sake.yaml#/PatchStockRequest"
  responses:
    "200":
      description: 在庫情報の部分更新に成功
      content:
        application/json:
          schema:
            $ref: "../components/schemas/sake.yaml#/SakeDetail"
    "400":
      $ref: "../components/responses/common.yaml#/BadRequest"
    "404":
      $ref: "../components/responses/common.yaml#/NotFound"
    "500":
      $ref: "../components/responses/common.yaml#/InternalServerError"

delete:
  tags:
    - Stocks
  summary: 在庫情報削除
  description: 指定された在庫情報を削除します
  operationId: deleteStock
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int32
      description: 在庫ID
  responses:
    "204":
      description: 在庫情報の削除に成功
    "400":
      $ref: "../components/responses/common.yaml#/BadRequest"
    "404":
      $ref: "../components/responses/common.yaml#/NotFound"
    "500":
      $ref: "../components/responses/common.yaml#/InternalServerError"
