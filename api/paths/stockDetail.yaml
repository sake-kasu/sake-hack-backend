get:
  tags:
    - stocks
  summary: 在庫詳細取得
  description: 在庫の詳細情報を取得します
  operationId: getStockDetail
  parameters:
    - $ref: "../components/schemas/stock.yaml#/StockIDPathParameter"
  responses:
    "200":
      description: 在庫詳細取得成功
      content:
        application/json:
          schema:
            $ref: "../components/schemas/stock.yaml#/StockDetail"
    "400":
      $ref: "../components/responses/common.yaml#/BadRequest"
    "404":
      $ref: "../components/responses/common.yaml#/NotFound"
    "500":
      $ref: "../components/responses/common.yaml#/InternalServerError"
patch:
  tags:
    - stocks
  summary: 在庫情報更新
  description: 在庫情報を更新します
  operationId: updateStock
  parameters:
    - $ref: "../components/schemas/stock.yaml#/StockIDPathParameter"
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas/stock.yaml#/UpdateStockRequest"
  responses:
    "200":
      description: 在庫情報更新成功
      content:
        application/json:
          schema:
            $ref: "../components/schemas/stock.yaml#/StockDetail"
    "400":
      $ref: "../components/responses/common.yaml#/BadRequest"
    "404":
      $ref: "../components/responses/common.yaml#/NotFound"
    "500":
      $ref: "../components/responses/common.yaml#/InternalServerError"
delete:
  tags:
    - stocks
  summary: 在庫削除
  description: 指定された在庫を削除します
  operationId: deleteStock
  parameters:
    - $ref: "../components/schemas/stock.yaml#/StockIDPathParameter"
  responses:
    "204":
      description: 在庫削除成功
    "400":
      $ref: "../components/responses/common.yaml#/BadRequest"
    "404":
      $ref: "../components/responses/common.yaml#/NotFound"
    "500":
      $ref: "../components/responses/common.yaml#/InternalServerError"
