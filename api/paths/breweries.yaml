get:
  tags:
    - Master
  summary: 酒造一覧取得
  description: 酒造の一覧を検索条件付きで取得します
  operationId: listBreweries
  parameters:
    - name: keyword
      in: query
      description: 酒造名で部分一致検索
      required: false
      schema:
        type: string
        maxLength: 100
    - name: limit
      in: query
      description: 取得件数上限
      required: false
      schema:
        type: integer
        format: int32
        default: 50
        minimum: 1
        maximum: 100
  responses:
    "200":
      description: 酒造一覧の取得に成功
      content:
        application/json:
          schema:
            $ref: "../components/schemas/master.yaml#/ListBreweriesResponse"
    "400":
      $ref: "../components/responses/common.yaml#/BadRequest"
    "500":
      $ref: "../components/responses/common.yaml#/InternalServerError"
