post:
  tags:
    - Stocks
  summary: 画像アップロードURL発行
  description: |
    指定された在庫の画像アップロード用署名付きURLを発行します。
    DBへの副作用はありません。アップロード成功後にPATCH /stocks/{id}でobjectKeyを保存してください。
  operationId: createStockUploadUrl
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
        format: int32
      description: 在庫ID
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas/storage.yaml#/PresignedUrlRequest"
  responses:
    "200":
      description: 署名付きURLの発行に成功
      content:
        application/json:
          schema:
            $ref: "../components/schemas/storage.yaml#/PresignedUrlResponse"
    "400":
      $ref: "../components/responses/common.yaml#/BadRequest"
    "404":
      $ref: "../components/responses/common.yaml#/NotFound"
    "500":
      $ref: "../components/responses/common.yaml#/InternalServerError"
