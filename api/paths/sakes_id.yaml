get:
  tags:
    - Sakes
  summary: 酒詳細取得
  description: 指定されたIDの酒の詳細を取得します
  operationId: getSake
  parameters:
    - name: id
      in: path
      required: true
      description: 酒ID
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 1
  responses:
    "200":
      description: 酒詳細の取得に成功
      content:
        application/json:
          schema:
            $ref: "../components/schemas/sake.yaml#/GetSakeResponse"
    "404":
      $ref: "../components/responses/common.yaml#/NotFound"
    "500":
      $ref: "../components/responses/common.yaml#/InternalServerError"

put:
  tags:
    - Sakes
  summary: 酒を更新
  description: 指定されたIDの酒を更新します
  operationId: updateSake
  parameters:
    - name: id
      in: path
      required: true
      description: 酒ID
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 1
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas/sake.yaml#/UpdateSakeRequest"
  responses:
    "200":
      description: 酒の更新に成功
      content:
        application/json:
          schema:
            $ref: "../components/schemas/sake.yaml#/UpdateSakeResponse"
    "400":
      $ref: "../components/responses/common.yaml#/BadRequest"
    "404":
      $ref: "../components/responses/common.yaml#/NotFound"
    "500":
      $ref: "../components/responses/common.yaml#/InternalServerError"

delete:
  tags:
    - Sakes
  summary: 酒を削除
  description: 指定されたIDの酒を削除します
  operationId: deleteSake
  parameters:
    - name: id
      in: path
      required: true
      description: 酒ID
      schema:
        type: integer
        format: int32
        minimum: 1
      example: 1
  responses:
    "204":
      description: 酒の削除に成功（レスポンスボディなし）
    "404":
      $ref: "../components/responses/common.yaml#/NotFound"
    "500":
      $ref: "../components/responses/common.yaml#/InternalServerError"
