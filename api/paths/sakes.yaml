get:
  tags:
    - Sake
  summary: 酒一覧取得
  description: 酒の一覧を取得します
  operationId: getSakes
  parameters:
    - $ref: "../components/parameters/offset.yaml#/Offset"
    - $ref: "../components/parameters/limit.yaml#/Limit"
    - name: category
      in: query
      description: 酒カテゴリ名
      required: false
      schema:
        type: string
        nullable: true
        enum:
          - BEER
          - JAPANESE_SAKE
          - WINE
          - WHISKEY
          - SHOCHU
          - COCKTAIL
          - OTHER
        x-oapi-codegen-extra-tags:
          validate: "omitempty,oneof=BEER JAPANESE_SAKE WINE WHISKEY SHOCHU COCKTAIL OTHER"
    - $ref: "../components/parameters/q.yaml#/Q"
  responses:
    "200":
      description: 酒一覧の取得に成功
      content:
        application/json:
          schema:
            $ref: "../components/schemas/sake.yaml#/ListSakesResponse"
    "400":
      $ref: "../components/responses/common.yaml#/BadRequest"
    "500":
      $ref: "../components/responses/common.yaml#/InternalServerError"
post:
  tags:
    - Sake
  summary: 酒情報登録
  description: 酒情報を登録します
  operationId: createSake
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas/sake.yaml#/CreateSakeRequest"
  responses:
    "200":
      description: 酒情報登録成功
      content:
        application/json:
          schema:
            $ref: "../components/schemas/sake.yaml#/SakeDetail"
    "400":
      $ref: "../components/responses/common.yaml#/BadRequest"
    "500":
      $ref: "../components/responses/common.yaml#/InternalServerError"
