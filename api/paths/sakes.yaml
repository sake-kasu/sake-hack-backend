get:
  tags:
    - Sake
  summary: 酒一覧取得
  description: 酒の一覧を取得します
  operationId: getSakes
  parameters:
    - $ref: "../components/parameters/common.yaml#/Offset"
    - $ref: "../components/parameters/common.yaml#/Limit"
    - name: category
      in: query
      description: 酒カテゴリ絞り込み
      required: false
      schema:
        $ref: "../components/schemas/sake.yaml#/SakeCategory"
        x-oapi-codegen-extra-tags:
          validate: "omitempty,oneof=JAPANESE_SAKE SHOCHU AWAMORI BEER WINE FRUIT_SAKE LIQUOR NON_ALCOHOL OTHER"
    - name: q
      in: query
      description: 酒名検索
      required: false
      schema:
        type: string
        x-oapi-codegen-extra-tags:
          validate: "omitempty"
  responses:
    "200":
      description: 酒一覧の取得に成功
      content:
        application/json:
          schema:
            $ref: "../components/schemas/sake.yaml#/ListSakesResponse"
    "400":
      $ref: "../components/responses/common.yaml#/BadRequest"
    "500":
      $ref: "../components/responses/common.yaml#/InternalServerError"
post:
  tags:
    - Sake
  summary: 酒情報登録
  description: 酒情報を登録します
  operationId: createSake
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas/sake.yaml#/CreateSakeRequest"
  responses:
    "200":
      description: 酒情報登録成功
      content:
        application/json:
          schema:
            $ref: "../components/schemas/sake.yaml#/SakeDetail"
    "400":
      $ref: "../components/responses/common.yaml#/BadRequest"
    "500":
      $ref: "../components/responses/common.yaml#/InternalServerError"
