get:
  tags:
    - Sakes
  summary: 酒一覧取得
  description: 酒の一覧をページネーション付きで取得します
  operationId: listSakes
  parameters:
    - name: offset
      in: query
      description: スキップする件数
      required: false
      schema:
        type: integer
        format: int32
        default: 0
        minimum: 0
        x-oapi-codegen-extra-tags:
          validate: "omitempty,min=0"
    - name: limit
      in: query
      description: 取得する件数
      required: false
      schema:
        type: integer
        format: int32
        default: 20
        minimum: 1
        maximum: 100
        x-oapi-codegen-extra-tags:
          validate: "omitempty,min=1,max=100"
    - name: typeId
      in: query
      description: 酒の種類IDでフィルタ
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        x-oapi-codegen-extra-tags:
          validate: "omitempty,min=1"
    - name: breweryId
      in: query
      description: 酒造IDでフィルタ
      required: false
      schema:
        type: integer
        format: int32
        minimum: 1
        x-oapi-codegen-extra-tags:
          validate: "omitempty,min=1"
  responses:
    "200":
      description: 酒一覧の取得に成功
      content:
        application/json:
          schema:
            $ref: "../components/schemas/sake.yaml#/ListSakesResponse"
    "400":
      $ref: "../components/responses/common.yaml#/BadRequest"
    "500":
      $ref: "../components/responses/common.yaml#/InternalServerError"

post:
  tags:
    - Sakes
  summary: 酒を登録
  description: 新しい酒を登録します
  operationId: createSake
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas/sake.yaml#/CreateSakeRequest"
        example:
          typeId: 3
          breweryId: 1
          name: "獺祭 純米大吟醸 磨き二割三分"
          abv: 16.0
          tasteNotes: "フルーティーで華やかな香り"
          memo: "特別な日に飲みたい"
          drinkStyleIds: [1, 2]
  responses:
    "201":
      description: 酒の登録に成功
      content:
        application/json:
          schema:
            $ref: "../components/schemas/sake.yaml#/CreateSakeResponse"
    "400":
      $ref: "../components/responses/common.yaml#/BadRequest"
    "404":
      $ref: "../components/responses/common.yaml#/NotFound"
    "500":
      $ref: "../components/responses/common.yaml#/InternalServerError"

/sakes/{id}:
  get:
    tags:
      - Sakes
    summary: 酒詳細取得
    description: 指定されたIDの酒の詳細を取得します
    operationId: getSake
    parameters:
      - name: id
        in: path
        required: true
        description: 酒ID
        schema:
          type: integer
          format: int32
          minimum: 1
        example: 1
    responses:
      "200":
        description: 酒詳細の取得に成功
        content:
          application/json:
            schema:
              $ref: "../components/schemas/sake.yaml#/GetSakeResponse"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"
      "500":
        $ref: "../components/responses/common.yaml#/InternalServerError"

  put:
    tags:
      - Sakes
    summary: 酒を更新
    description: 指定されたIDの酒を更新します
    operationId: updateSake
    parameters:
      - name: id
        in: path
        required: true
        description: 酒ID
        schema:
          type: integer
          format: int32
          minimum: 1
        example: 1
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas/sake.yaml#/UpdateSakeRequest"
    responses:
      "200":
        description: 酒の更新に成功
        content:
          application/json:
            schema:
              $ref: "../components/schemas/sake.yaml#/UpdateSakeResponse"
      "400":
        $ref: "../components/responses/common.yaml#/BadRequest"
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"
      "500":
        $ref: "../components/responses/common.yaml#/InternalServerError"

  delete:
    tags:
      - Sakes
    summary: 酒を削除
    description: 指定されたIDの酒を削除します
    operationId: deleteSake
    parameters:
      - name: id
        in: path
        required: true
        description: 酒ID
        schema:
          type: integer
          format: int32
          minimum: 1
        example: 1
    responses:
      "204":
        description: 酒の削除に成功（レスポンスボディなし）
      "404":
        $ref: "../components/responses/common.yaml#/NotFound"
      "500":
        $ref: "../components/responses/common.yaml#/InternalServerError"
