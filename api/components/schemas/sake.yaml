SakeType:
  type: object
  required:
    - id
    - name
  properties:
    id:
      type: integer
      format: int32
      description: 酒の種類ID
    name:
      type: string
      description: 酒の種類の名前
      example: 日本酒

Brewery:
  type: object
  required:
    - id
    - name
    - originCountry
  properties:
    id:
      type: integer
      format: int32
      description: 酒造ID
    name:
      type: string
      description: 酒造名
      example: 獺祭
    originCountry:
      type: string
      description: 所在国
      example: 日本
    originRegion:
      type: string
      nullable: true
      description: 所在地域
      example: 山口県
    latitude:
      type: number
      format: double
      nullable: true
      description: 緯度
    longitude:
      type: number
      format: double
      nullable: true
      description: 経度

DrinkStyle:
  type: object
  required:
    - id
    - name
  properties:
    id:
      type: integer
      format: int32
      description: 飲み方ID
    name:
      type: string
      description: 飲み方の名前
      example: ストレート
    description:
      type: string
      nullable: true
      description: 詳細説明
      example: お酒そのままの味を楽しむ飲み方

Sake:
  type: object
  required:
    - id
    - type
    - brewery
    - name
    - abv
    - tasteNotes
    - drinkStyles
    - createdAt
    - updatedAt
  properties:
    id:
      type: integer
      format: int32
      description: 酒ID
    type:
      $ref: "#/SakeType"
    brewery:
      $ref: "#/Brewery"
    name:
      type: string
      description: 酒名
      example: 獺祭 純米大吟醸 磨き二割三分
    abv:
      type: number
      format: float
      description: アルコール度数(%)
      example: 16.0
    tasteNotes:
      type: string
      description: 味の特徴
      example: フルーティーで華やかな香り
    memo:
      type: string
      nullable: true
      description: 感想
    drinkStyles:
      type: array
      items:
        $ref: "#/DrinkStyle"
      description: おすすめの飲み方
    createdAt:
      type: string
      format: date-time
      description: 作成日時
    updatedAt:
      type: string
      format: date-time
      description: 更新日時

SakeListMeta:
  type: object
  required:
    - total
    - offset
    - limit
  properties:
    total:
      type: integer
      format: int64
      description: 総件数
      example: 100
    offset:
      type: integer
      format: int32
      description: スキップした件数
      example: 0
    limit:
      type: integer
      format: int32
      description: 取得した件数
      example: 20

ListSakesResponse:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: "#/Sake"
      description: 酒のリスト
    meta:
      $ref: "#/SakeListMeta"
    errors:
      type: array
      items:
        $ref: "./common.yaml#/APIError"

CreateSakeRequest:
  type: object
  required:
    - typeId
    - breweryId
    - name
    - abv
    - tasteNotes
    - drinkStyleIds
  properties:
    typeId:
      type: integer
      format: int32
      description: 酒の種類ID（sake_types.id）
      minimum: 1
      example: 1
      x-oapi-codegen-extra-tags:
        validate: "required,min=1"
    breweryId:
      type: integer
      format: int32
      description: 酒造ID（breweries.id）
      minimum: 1
      example: 1
      x-oapi-codegen-extra-tags:
        validate: "required,min=1"
    name:
      type: string
      description: 酒名
      minLength: 1
      maxLength: 255
      example: "獺祭 純米大吟醸 磨き二割三分"
      x-oapi-codegen-extra-tags:
        validate: "required,min=1,max=255"
    abv:
      type: number
      format: float
      description: アルコール度数(%)
      minimum: 0
      maximum: 99.99
      example: 16.0
      x-oapi-codegen-extra-tags:
        validate: "required,min=0,max=99.99"
    tasteNotes:
      type: string
      description: 味の特徴
      minLength: 1
      maxLength: 1000
      example: "フルーティーで華やかな香り"
      x-oapi-codegen-extra-tags:
        validate: "required,min=1,max=1000"
    memo:
      type: string
      nullable: true
      description: 感想（任意）
      maxLength: 1000
      example: "特別な日に飲みたい"
      x-oapi-codegen-extra-tags:
        validate: "omitempty,max=2000"
    drinkStyleIds:
      type: array
      items:
        type: integer
        format: int32
        minimum: 1
      description: おすすめの飲み方IDリスト（drink_styles.id）
      minItems: 1
      example: [1, 2]
      x-oapi-codegen-extra-tags:
        validate: "required,min=1,dive,min=1"

CreateSakeResponse:
  type: object
  properties:
    data:
      $ref: "#/Sake"
    errors:
      type: array
      items:
        $ref: "./common.yaml#/APIError"

GetSakeResponse:
  type: object
  properties:
    data:
      $ref: "#/Sake"
    errors:
      type: array
      items:
        $ref: "./common.yaml#/APIError"

