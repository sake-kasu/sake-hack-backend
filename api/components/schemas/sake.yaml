# Shared primitive and small reusable schemas
SakeID:
  type: string
  format: uuid
  description: 酒ID
  example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

SakeName:
  type: string
  description: 酒名
  example: 獺祭
  maxLength: 50

ImageURL:
  type: string
  nullable: true
  description: 画像URL（S3）
  example: https://example.com/images/sake.jpg

ImageData:
  type: string
  format: byte
  nullable: true
  description: 画像データ（Base64エンコード）

SakeCategory:
  type: string
  enum:
    - BEER
    - JAPANESE_SAKE
    - WINE
    - WHISKEY
    - SHOCHU
    - COCKTAIL
    - OTHER
  description: 酒カテゴリ
  example: JAPANESE_SAKE

CategoryDescription:
  type: string
  nullable: true
  description: 酒カテゴリ詳細
  example: 純米大吟醸
  maxLength: 100

AlcoholPercentage:
  type: number
  format: float
  description: アルコール度数(%)
  example: 16.0
  multipleOf: 0.1
  minimum: 0.0
  maximum: 100.0
  nullable: true

VolumeMax:
  type: integer
  description: 最大容量(ml)
  example: 720
  nullable: true

VolumeRemain:
  type: integer
  description: 残量(%)
  example: 75
  nullable: true
  maximum: 100
  minimum: 0

Region:
  type: string
  description: 産地
  example: 山口県
  nullable: true

Price:
  type: integer
  description: 金額(円)
  example: 1500
  nullable: true

Memo:
  type: string
  description: メモ
  example: 美味しい
  nullable: true
  maxLength: 500

# Compound schemas for reuse
SakeDetail:
  type: object
  description: 酒詳細情報
  required:
    - id
    - name
    - image_url
    - category
    - description
    - alcohol_percentage
    - volume_max
    - volume_remain
    - region
    - price
    - memo
    - created_at
    - updated_at
  properties:
    id:
      $ref: "#/SakeID"
    name:
      $ref: "#/SakeName"
    image_url:
      $ref: "#/ImageURL"
    category:
      $ref: "#/SakeCategory"
    description:
      $ref: "#/CategoryDescription"
    alcohol_percentage:
      $ref: "#/AlcoholPercentage"
    volume_max:
      $ref: "#/VolumeMax"
    volume_remain:
      $ref: "#/VolumeRemain"
    region:
      $ref: "#/Region"
    price:
      $ref: "#/Price"
    memo:
      $ref: "#/Memo"
    created_at:
      type: string
      format: date-time
      description: 作成日時
    updated_at:
      type: string
      format: date-time
      description: 更新日時

# Request/response schemas
ListSakesResponse:
  type: object
  required:
    - total
    - sakes
  properties:
    total:
      type: integer
      description: 酒の総数
    sakes:
      type: array
      items:
        $ref: "#/SakeDetail"
      description: 酒リスト

CreateSakeRequest:
  type: object
  required:
    - name
    - image_data
    - category
    - description
    - alcohol_percentage
    - volume_max
    - volume_remain
    - region
    - price
    - memo
  properties:
    name:
      $ref: "#/SakeName"
    image_data:
      $ref: "#/ImageData"
    category:
      $ref: "#/SakeCategory"
    description:
      $ref: "#/CategoryDescription"
    alcohol_percentage:
      $ref: "#/AlcoholPercentage"
    volume_max:
      $ref: "#/VolumeMax"
    volume_remain:
      $ref: "#/VolumeRemain"
    region:
      $ref: "#/Region"
    price:
      $ref: "#/Price"
    memo:
      $ref: "#/Memo"

UpdateSakeRequest:
  type: object
  description: 更新リクエスト。フィールドを省略すると変更なし、nullを指定すると明示的にnullに更新
  properties:
    name:
      allOf:
        - $ref: "#/SakeName"
      nullable: true
    image_data:
      $ref: "#/ImageData"
    category:
      allOf:
        - $ref: "#/SakeCategory"
      nullable: true
    description:
      $ref: "#/CategoryDescription"
    alcohol_percentage:
      $ref: "#/AlcoholPercentage"
    volume_max:
      $ref: "#/VolumeMax"
    volume_remain:
      $ref: "#/VolumeRemain"
    region:
      $ref: "#/Region"
    price:
      $ref: "#/Price"
    memo:
      $ref: "#/Memo"
