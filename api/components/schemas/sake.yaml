Sake:
  type: object
  required:
    - id
    - name
    - category
    - imagePreview
  properties:
    id:
      type: integer
      format: int32
      description: 酒ID
    name:
      type: string
      description: 酒名
    category:
      type:
        $ref: "#/Category"
      description: 酒カテゴリ
    imagePreview:
      type: string
      nullable: true
      description: 画像URL formatは実装次第

SakeDetail:
  type: object
  required:
    - id
    - name
    - category
    - kind
    - brewery
    - abv
    - purchaseVolume
    - remainingVolume
    - memo
    - drinkStyles
    - price
    - createdAt
    - updatedAt
  properties:
    id:
      type: integer
      format: int32
      description: 酒ID
    category:
      $ref: "#/SakeCategory"
    kind:
      $ref: "#/SakeKind"
    brewery:
      $ref: "#/Brewery"
    name:
      $ref: "#/SakeName"
    abv:
      type: number
      format: float
      description: アルコール度数(%)
      example: 16.0
    purchaseVolume:
      type: number
      format: float
      description: 購入時容量
    remainingVolume:
      type: number
      format: float
      description: 残容量
    memo:
      type: string
      nullable: true
      description: 感想
    drinkStyles:
      type: array
      items:
        $ref: "#/DrinkStyle"
      description: おすすめの飲み方
    price:
      type: integer
      format: int32
      description: 購入時価格
    imageUrl:
      type: string
      description: 表示用の画像URL
    createdAt:
      type: string
      format: date-time
      description: 作成日時
    updatedAt:
      type: string
      format: date-time
      description: 更新日時

ListSakesResponse:
  type: object
  required:
    - total
    - sakes
  properties:
    total:
      type: integer
      description: 酒の総数
    sakes:
      type: array
      items:
        $ref: "#/Sake"
      description: 酒リスト

CreateSakeRequest:
  type: object
  required:
    - category
    - kind
    - brewery
    - name
    - abv
    - purchaseVolume
    - remainingVolume
    - memo
    - drinkStyles
    - price
  properties:
    category:
      $ref: "#/SakeCategory"
    kind:
      $ref: "#/SakeKind"
    brewery:
      $ref: "#/Brewery"
    name:
      $ref: "#/SakeName"
    abv:
      type: number
      format: float
      description: アルコール度数(%)
      example: 16.0
    purchaseVolume:
      type: number
      format: float
      description: 購入時容量
    remainingVolume:
      type: number
      format: float
      description: 残容量
    memo:
      type: string
      nullable: true
      description: 感想
    drinkStyles:
      type: array
      items:
        $ref: "#/DrinkStyle"
      description: おすすめの飲み方
    price:
      type: integer
      format: int32
      description: 購入時価格
    imageUrl:
      type: string
      description: 表示用の画像URL

CreateSakeResponse:
  type: object
  properties:
    data:
      $ref: "#/Sake"
    errors:
      type: array
      items:
        $ref: "./common.yaml#/APIError"

GetSakeResponse:
  type: object
  properties:
    data:
