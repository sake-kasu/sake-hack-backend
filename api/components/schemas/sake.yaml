# Shared primitive and small reusable schemas
SakeID:
  type: string
  format: uuid
  description: 酒ID
  example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

SakeName:
  type: string
  description: 酒名
  example: 獺祭
  maxLength: 50

Furigana:
  type: string
  description: 酒名のフリガナ
  example: たんざい
  nullable: true
  maxLength: 100

SakeCategory:
  type: string
  enum:
    - BEER
    - JAPANESE_SAKE
    - WINE
    - WHISKEY
    - SHOCHU
    - COCKTAIL
    - OTHER
  description: 酒カテゴリ
  example: JAPANESE_SAKE

ImageURL:
  type: string
  nullable: true
  description: 画像URL
  example: https://example.com/images/sake.jpg

SubCategory:
  type: object
  format: json
  nullable: true
  description: 酒サブカテゴリ
  example: { "type": "純米大吟醸", "brand": "獺祭" }

AlcoholPercentage:
  type: number
  format: float
  description: アルコール度数(%)
  example: 16.0
  nullable: true

Volume:
  type: number
  format: float
  description: 容量(ml)
  example: 720.0
  nullable: true

RemainingAmount:
  type: number
  format: float
  description: 残容量
  example: 360.0
  nullable: true

ProductionArea:
  type: string
  nullable: true
  description: 生産地
  example: 山口県

Price:
  type: integer
  format: int32
  description: 金額(円)
  nullable: true
  example: 1500

Memo:
  type: string
  nullable: true
  maxLength: 500
  description: メモ
  example: フルーティーで飲みやすい

QrCode:
  type: string
  description: QRコード識別子
  example: QR1234567890

# Compound schemas for reuse
SakeDetail:
  type: object
  description: 酒詳細情報
  required:
    - id
    - name
    - furigana
    - image_url
    - category
    - sub_category
    - alcohol_percentage
    - capacity
    - remaining_amount
    - production_area
    - price
    - memo
    - qr_code
    - created_at
    - updated_at
  properties:
    id:
      $ref: "#/SakeID"
    name:
      $ref: "#/SakeName"
    furigana:
      $ref: "#/Furigana"
    image_url:
      $ref: "#/ImageURL"
    category:
      $ref: "#/SakeCategory"
    sub_category:
      $ref: "#/SubCategory"
    alcohol_percentage:
      $ref: "#/AlcoholPercentage"
    capacity:
      $ref: "#/Volume"
    remaining_amount:
      $ref: "#/RemainingAmount"
    production_area:
      $ref: "#/ProductionArea"
    price:
      $ref: "#/Price"
    memo:
      $ref: "#/Memo"
    qr_code:
      $ref: "#/QrCode"
    created_at:
      type: string
      format: date-time
      description: 作成日時
    updated_at:
      type: string
      format: date-time
      description: 更新日時

# Request/response schemas
ListSakesResponse:
  type: object
  required:
    - total
    - sakes
  properties:
    total:
      type: integer
      description: 酒の総数
    sakes:
      type: array
      items:
        $ref: "#/SakeDetail"
      description: 酒リスト

SakeInput:
  type: object
  required:
    - name
    - furigana
    - image_url
    - category
    - sub_category
    - alcohol_percentage
    - capacity
    - remaining_amount
    - production_area
    - price
    - memo
  properties:
    name:
      $ref: "#/SakeName"
    furigana:
      $ref: "#/Furigana"
    image_url:
      $ref: "#/ImageURL"
    category:
      $ref: "#/SakeCategory"
    sub_category:
      $ref: "#/SubCategory"
    alcohol_percentage:
      $ref: "#/AlcoholPercentage"
    capacity:
      $ref: "#/Volume"
    remaining_amount:
      $ref: "#/RemainingAmount"
    production_area:
      $ref: "#/ProductionArea"
    price:
      $ref: "#/Price"
    memo:
      $ref: "#/Memo"

CreateSakeRequest:
  $ref: "#/SakeInput"

UpdateSakeRequest:
  $ref: "#/SakeInput"
