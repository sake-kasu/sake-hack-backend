# Shared primitive and small reusable schemas
SakeID:
  type: string
  format: uuid
  description: 酒ID
  example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

SakeName:
  type: string
  description: 酒名
  example: 獺祭
  maxLength: 50

ImageURL:
  type: string
  nullable: true
  description: 画像URL
  example: https://example.com/images/sake.jpg

SakeCategory:
  type: string
  enum:
    - BEER
    - JAPANESE_SAKE
    - WINE
    - WHISKEY
    - SHOCHU
    - COCKTAIL
    - OTHER
  description: 酒カテゴリ
  example: JAPANESE_SAKE

Subcategory:
  type: string
  nullable: true
  description: 酒サブカテゴリ
  example: 純米大吟醸
  maxLength: 500

AlcoholPercentage:
  type: number
  format: float
  description: アルコール度数(%)
  example: 16.0
  multipleOf: 0.1
  minimum: 0
  maximum: 100
  nullable: true

Volume:
  type: integer
  description: 容量(ml)
  example: 720
  nullable: true

Origin:
  type: string
  description: 生産地
  example: 山口県
  nullable: true

Price:
  type: integer
  description: 金額(円)
  example: 1500
  nullable: true

Stock:
  type: integer
  description: 在庫数
  example: 10
  nullable: true

QrCode:
  type: string
  description: QRコード識別子
  example: QR1234567890

# Compound schemas for reuse
SakeDetail:
  type: object
  description: 酒詳細情報
  required:
    - id
    - name
    - image_url
    - category
    - subcategory
    - alcohol_percentage
    - volume
    - origin
    - price
    - stock
    - qr_code
    - created_at
    - updated_at
  properties:
    id:
      $ref: "#/SakeID"
    name:
      $ref: "#/SakeName"
    image_url:
      $ref: "#/ImageURL"
    category:
      $ref: "#/SakeCategory"
    subcategory:
      $ref: "#/Subcategory"
    alcohol_percentage:
      $ref: "#/AlcoholPercentage"
    volume:
      $ref: "#/Volume"
    origin:
      $ref: "#/Origin"
    price:
      $ref: "#/Price"
    stock:
      $ref: "#/Stock"
    qr_code:
      $ref: "#/QrCode"
    created_at:
      type: string
      format: date-time
      description: 作成日時
    updated_at:
      type: string
      format: date-time
      description: 更新日時

# Request/response schemas
ListSakesResponse:
  type: object
  required:
    - total
    - sakes
  properties:
    total:
      type: integer
      description: 酒の総数
    sakes:
      type: array
      items:
        $ref: "#/SakeDetail"
      description: 酒リスト

SakeInput:
  type: object
  required:
    - name
    - image_url
    - category
    - subcategory
    - alcohol_percentage
    - volume
    - origin
    - price
    - stock
  properties:
    name:
      $ref: "#/SakeName"
    image_url:
      $ref: "#/ImageURL"
    category:
      $ref: "#/SakeCategory"
    subcategory:
      $ref: "#/Subcategory"
    alcohol_percentage:
      $ref: "#/AlcoholPercentage"
    volume:
      $ref: "#/Volume"
    origin:
      $ref: "#/Origin"
    price:
      $ref: "#/Price"
    stock:
      $ref: "#/Stock"
CreateSakeRequest:
  $ref: "#/SakeInput"

UpdateSakeRequest:
  $ref: "#/SakeInput"
