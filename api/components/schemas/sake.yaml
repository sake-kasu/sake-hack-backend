# Sake schemas (公開閲覧用 - 容量、在庫数、価格は含まない)

# Common Parameters
SakeIDPathParameter:
  name: id
  in: path
  required: true
  schema:
    type: string
    format: uuid
  description: 酒ID

CategoryQueryParameter:
  name: category
  in: query
  description: 酒カテゴリ絞り込み
  required: false
  schema:
    $ref: "#/SakeCategory"
    x-oapi-codegen-extra-tags:
      validate: "omitempty,oneof=JAPANESE_SAKE SHOCHU AWAMORI BEER WINE FRUIT_SAKE LIQUOR NON_ALCOHOL OTHER"

SearchQueryParameter:
  name: q
  in: query
  description: 酒名検索
  required: false
  schema:
    type: string
    x-oapi-codegen-extra-tags:
      validate: "omitempty"

# Schema definitions
SakeID:
  type: string
  format: uuid
  description: 酒ID
  example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"

SakeName:
  type: string
  description: 酒名
  example: 獺祭
  maxLength: 50

ImageURL:
  type: string
  nullable: true
  description: 画像URL(S3)
  example: https://example.com/images/sake.jpg

SakeCategory:
  type: string
  enum:
    - JAPANESE_SAKE #清酒
    - SHOCHU #焼酎
    - AWAMORI #泡盛
    - BEER #ビール
    - WINE #ワイン
    - FRUIT_SAKE #果実酒
    - LIQUOR #洋酒
    - NON_ALCOHOL #ノンアルコール
    - OTHER
  description: 酒カテゴリ
  example: JAPANESE_SAKE

CategoryDescription:
  type: string
  nullable: true
  description: 酒カテゴリ詳細
  example: 純米大吟醸
  maxLength: 100

AlcoholPercentage:
  type: number
  format: float
  description: アルコール度数(%)
  example: 16.0
  multipleOf: 0.1
  minimum: 0.0
  maximum: 100.0
  nullable: true

Region:
  type: string
  description: 産地
  example: 山口県
  nullable: true

Memo:
  type: string
  description: メモ
  example: 美味しい
  nullable: true
  maxLength: 500

# Compound schemas
SakeDetail:
  type: object
  description: 酒詳細情報（公開用 - 容量、在庫数、価格は含まない）
  required:
    - id
    - name
    - image_url
    - category
    - description
    - alcohol_percentage
    - region
    - memo
    - created_at
    - updated_at
  properties:
    id:
      $ref: "#/SakeID"
    name:
      $ref: "#/SakeName"
    image_url:
      $ref: "#/ImageURL"
    category:
      $ref: "#/SakeCategory"
    description:
      $ref: "#/CategoryDescription"
    alcohol_percentage:
      $ref: "#/AlcoholPercentage"
    region:
      $ref: "#/Region"
    memo:
      $ref: "#/Memo"
    created_at:
      type: string
      format: date-time
      description: 作成日時
    updated_at:
      type: string
      format: date-time
      description: 更新日時

# Response schemas
ListSakesResponse:
  type: object
  required:
    - total
    - sakes
  properties:
    total:
      type: integer
      description: 酒の総数
    sakes:
      type: array
      items:
        $ref: "#/SakeDetail"
      description: 酒リスト
