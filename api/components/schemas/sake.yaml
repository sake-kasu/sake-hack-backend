SakeID:
  type: string
  format: uuid
  description: 酒ID
  example: "3fa85f64-5717-4562-b3fc-2c963f66afa6"
SakeName:
  type: string
  description: 酒名
  example: 獺祭
Furigana:
  type: string
  description: 酒名のフリガナ
  example: たんざい
  nullable: true
SakeCategory:
  type: string
  enum:
    - BEER
    - JAPANESE_SAKE
    - WINE
    - WHISKEY
    - SHOCHU
    - COCKTAIL
    - OTHER
  description: 酒カテゴリ
  example: JAPANESE_SAKE
ImageURL:
  type: string
  nullable: true
  description: 画像URL
AlcoholPercentage:
  type: number
  format: float
  description: アルコール度数(%)
  example: 16.0
  nullable: true
Capacity:
  type: number
  format: float
  description: 容量(ml)
  example: 720.0
  nullable: true
RemainingAmount:
  type: number
  format: float
  description: 残容量
  example: 360.0
  nullable: true
ProductionArea:
  type: string
  nullable: true
  description: 生産地
  example: 山口県
Price:
  type: integer
  format: int32
  description: 金額(円)
  nullable: true
  example: 1500
Memo:
  type: string
  nullable: true
  maxLength: 500
  description: メモ
  example: フルーティーで飲みやすい
QrCode:
  type: string
  description: QRコード識別子
  example: QR1234567890
CreatedAt:
  type: string
  format: date-time
  description: 作成日時
UpdatedAt:
  type: string
  format: date-time
  description: 更新日時

Sake:
  type: object
  required:
    - id
    - name
    - furigana
    - category
    - image_url
  description: 酒
  properties:
    id:
      $ref: "#/SakeID"
    name:
      $ref: "#/SakeName"
    furigana:
      $ref: "#/Furigana"
    category:
      $ref: "#/SakeCategory"
    image_url:
      $ref: "#/ImageURL"

ListSakesResponse:
  type: object
  required:
    - total
    - sakes
  properties:
    total:
      type: integer
      description: 酒の総数
    sakes:
      type: array
      items:
        $ref: "#/Sake"
      description: 酒リスト

SakeDetail:
  type: object
  required:
    - id
    - name
    - furigana
    - category
    - sub_category
    - alcohol_percentage
    - capacity
    - remaining_amount
    - production_area
    - price
    - memo
    - qr_code
    - created_at
    - updated_at
  description: 酒詳細情報
  properties:
    id:
      $ref: "#/SakeID"
    name:
      $ref: "#/SakeName"
    furigana:
      $ref: "#/Furigana"
    category:
      $ref: "#/SakeCategory"
    sub_category:
      type: object
      format: json
      nullable: true
      description: 酒サブカテゴリ
    alcohol_percentage:
      $ref: "#/AlcoholPercentage"
    capacity:
      $ref: "#/Capacity"
    remaining_amount:
      $ref: "#/RemainingAmount"
    production_area:
      $ref: "#/ProductionArea"
    price:
      $ref: "#/Price"
    memo:
      $ref: "#/Memo"
    qr_code:
      $ref: "#/QrCode"
    created_at:
      $ref: "#/CreatedAt"
    updated_at:
      $ref: "#/UpdatedAt"

CreateSakeRequest:
  type: object
  required:
    - name
    - furigana
    - category
    - sub_category
    - alcohol_percentage
    - capacity
    - remaining_amount
    - production_area
    - price
    - memo
  description: 酒詳細情報
  properties:
    name:
      $ref: "#/SakeName"
    furigana:
      $ref: "#/Furigana"
    category:
      $ref: "#/SakeCategory"
    sub_category:
      type: object
      format: json
      nullable: true
      description: 酒サブカテゴリ
    alcohol_percentage:
      $ref: "#/AlcoholPercentage"
    capacity:
      $ref: "#/Capacity"
    remaining_amount:
      $ref: "#/RemainingAmount"
    production_area:
      $ref: "#/ProductionArea"
    price:
      $ref: "#/Price"
    memo:
      $ref: "#/Memo"
