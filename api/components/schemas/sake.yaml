SakeKind:
  type: object
  required:
    - id
    - name
  properties:
    id:
      type: integer
      format: int32
      description: 酒の小分類ID
    name:
      type: string
      description: 酒の小分類の名前
      example: 大吟醸

SakeCategory:
  type: string
  enum:
    - JAPANESE_SAKE
    - WHISKY
    - WINE
    - BEER
    - SHOCHU
    - AWAMORI
    - RIQUEUR
    - SPIRITS
    - OTHER

SakeName:
  type: object
  required:
    - name
    - phonetic
  properties:
    name:
      type: string
      description: 漢字・英名の名前
    phonetic: 
      type: string
      description: 読み方

Brewery:
  type: object
  required:
    - id
    - name
    - originCountry
  properties:
    id:
      type: integer
      format: int32
      description: 酒造ID
    name:
      type: string
      description: 酒造名
      example: 獺祭
    originCountry:
      type: string
      description: 所在国
      example: 日本
    originRegion:
      type: string
      nullable: true
      description: 所在地域
      example: 山口県
    latitude:
      type: number
      format: double
      nullable: true
      description: 緯度
    longitude:
      type: number
      format: double
      nullable: true
      description: 経度

DrinkStyle:
  type: object
  required:
    - id
    - name
  properties:
    id:
      type: integer
      format: int32
      description: 飲み方ID
    name:
      type: string
      description: 飲み方の名前
      example: ストレート
    description:
      type: string
      nullable: true
      description: 詳細説明
      example: お酒そのままの味を楽しむ飲み方

Sake:
  type: object
  required:
    - id
    - category
    - name
    - imagePreview
  properties:
    id:
      type: integer
      format: int32
      description: 酒ID
    category:
      $ref: "#/SakeCategory"
    name:
      type: string
      description: 酒名
    imagePreview:
      type: string
      description: 画像URL formatは実装次第

SakeDetail:
  type: object
  required:
    - id
    - category
    - kind
    - brewery
    - name
    - abv
    - purchaseVolume
    - remainingVolume
    - memo 
    - drinkStyles
    - price
    - createdAt
    - updatedAt
  properties:
    id:
      type: integer
      format: int32
      description: 酒ID
    category:
      $ref: "#/SakeCategory"
    kind:
      $ref: "#/SakeKind"
    brewery:
      $ref: "#/Brewery"
    name:
      $ref: "#/SakeName"
    abv:
      type: number
      format: float
      description: アルコール度数(%)
      example: 16.0
    purchaseVolume:
      type: number
      format: float
      description: 購入時容量
    remainingVolume:
      type: number
      format: float
      description: 残容量
    memo:
      type: string
      nullable: true
      description: 感想
    drinkStyles:
      type: array
      items:
        $ref: "#/DrinkStyle"
      description: おすすめの飲み方
    price: 
      type: integer
      format: int32
      description: 購入時価格
    imageUrl:
      type: string
      description: 表示用の画像URL
    createdAt:
      type: string
      format: date-time
      description: 作成日時
    updatedAt:
      type: string
      format: date-time
      description: 更新日時

SakeListMeta:
  type: object
  required:
    - total
    - offset
    - limit
  properties:
    total:
      type: integer
      format: int64
      description: 総件数
      example: 100
    offset:
      type: integer
      format: int32
      description: スキップした件数
      example: 0
    limit:
      type: integer
      format: int32
      description: 取得した件数
      example: 20

ListSakesResponse:
  type: object
  properties:
    data:
      type: array
      items:
        $ref: "#/Sake"
      description: 酒のリスト
    meta:
      $ref: "#/SakeListMeta"
    errors:
      type: array
      items:
        $ref: "./common.yaml#/APIError"

