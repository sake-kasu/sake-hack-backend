HealthResponse:
  type: object
  required:
    - status
    - timestamp
  properties:
    status:
      type: string
      example: ok
      description: サーバーの状態
    timestamp:
      type: string
      format: date-time
      example: "2025-11-22T10:00:00Z"
      description: チェック時刻
    database:
      type: object
      properties:
        postgres:
          type: string
          example: ok
        mysql:
          type: string
          example: ok
        valkey:
          type: string
          example: ok

ErrorCode:
  type: string
  description: |
    エラーコードまたはワーニングコード
    - E0001: 認証エラー
    - E0002: データベース実行エラー
    - W0001: バリデーションエラー
    - E9000: その他エラー
  enum:
    - E0001
    - E0002
    - W0001
    - E9000
  example: E0001

ErrorResponse:
  type: object
  required:
    - error_code
    - message
  properties:
    error_code:
      $ref: "#/ErrorCode"
    message:
      type: string
      description: エラーメッセージ
      example: 認証に失敗しました。有効なトークンを提供してください。
    reason:
      type: string
      nullable: true
      description: エラーの詳細な理由（オプション）
      example: トークンの有効期限が切れています
