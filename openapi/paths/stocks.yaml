get:
  tags:
    - stocks
  summary: 在庫一覧取得
  operationId: listStocks
  parameters:
    - $ref: "../components/parameters/common.yaml#/Offset"
    - $ref: "../components/parameters/common.yaml#/Limit"
  responses:
    '200':
      description: 在庫一覧取得成功
      content:
        application/json:
          schema:
            $ref: "../components/schemas/stock.yaml#/ListStockResponse"
    '400':
      $ref: "../components/responses/common.yaml#/BadRequest"
    '500':
      $ref: "../components/responses/common.yaml#/InternalServerError"

post:
  tags:
    - stocks
  summary: 在庫登録
  operationId: createStock
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: "../components/schemas/stock.yaml#/CreateStockRequest"
  responses:
    '201':
      description: 在庫登録成功
      content:
        application/json:
          schema:
            $ref: "../components/schemas/stock.yaml#/StockDetail"
    '400':
      $ref: "../components/responses/common.yaml#/BadRequest"
    '500':
      $ref: "../components/responses/common.yaml#/InternalServerError"
