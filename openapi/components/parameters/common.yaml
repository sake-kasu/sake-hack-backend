Offset:
  name: offset
  in: query
  required: true
  description: スキップする件数
  schema:
    type: integer
    format: int32
    minimum: 0

Limit:
  name: limit
  in: query
  required: true
  description: 取得件数
  schema:
    type: integer
    format: int32
    minimum: 1
    maximum: 100

TypeId:
  name: typeId
  in: query
  required: true
  description: 酒の種類ID
  schema:
    type: integer
    format: int32
    minimum: 1

BreweryId:
  name: breweryId
  in: query
  required: true
  description: 酒造ID
  schema:
    type: integer
    format: int32
    minimum: 1

SakeId:
  name: id
  in: path
  required: true
  description: 酒ID
  schema:
    type: integer
    format: int32
    minimum: 1

StockId:
  name: id
  in: path
  required: true
  description: 在庫ID
  schema:
    type: integer
    format: int32
    minimum: 1
