Offset:
  name: offset
  in: query
  required: true
  description: スキップする件数
  schema:
    type: integer
    format: int32
    minimum: 0

Limit:
  name: limit
  in: query
  required: true
  description: 取得件数
  schema:
    type: integer
    format: int32
    minimum: 1
    maximum: 100

SakeId:
  name: id
  in: path
  required: true
  description: 酒ID
  schema:
    type: string
    format: uuid

StockId:
  name: id
  in: path
  required: true
  description: 在庫ID
  schema:
    type: string
    format: uuid
