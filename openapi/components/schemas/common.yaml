APIError:
  type: object
  required:
    - code
    - message
  properties:
    code:
      type: string
      description: アプリケーション側で定義したエラーコード
      example: W0001
    message:
      type: string
      description: ユーザー向けのエラー説明メッセージ
      example: "offset: オフセットは0以上である必要があります"

ErrorResponse:
  type: object
  required:
    - data
    - errors
  properties:
    data:
      nullable: true
      description: エラー時は常に null
    errors:
      type: array
      description: 発生したエラー情報の一覧
      items:
        $ref: "#/APIError"

SakeListMeta:
  type: object
  required:
    - total
    - offset
    - limit
  properties:
    total:
      type: integer
      description: 条件に一致する総件数
    offset:
      type: integer
      description: 応答で適用されたオフセット値
    limit:
      type: integer
      description: 応答で適用された取得件数上限
