SakeCategory:
  type: string
  description: お酒のカテゴリ区分
  enum:
    - JAPANESE_SAKE
    - SHOCHU
    - AWAMORI
    - BEER
    - WINE
    - FRUIT_WINE
    - LIQUEUR
    - NON_ALCOHOL
    - OTHER

SakeImage:
  type: object
  required:
    - id
    - sakeId
    - imageKey
    - sortOrder
    - createdAt
  properties:
    id:
      type: string
      format: uuid
    sakeId:
      type: string
      format: uuid
    imageKey:
      type: string
    sortOrder:
      type: integer
      format: int32
      minimum: 0
    createdAt:
      type: string
      format: date-time

Sake:
  type: object
  description: お酒一覧表示向けの基本情報
  required:
    - id
    - category
    - name
  properties:
    id:
      type: string
      format: uuid
    category:
      $ref: "#/SakeCategory"
    name:
      type: string
      maxLength: 50
    phonetic:
      type: string
      nullable: true
      maxLength: 100
    firstImageKey:
      type: string
      nullable: true
      description: 先頭画像のキー（存在する場合）

ListSakesResponse:
  type: object
  description: お酒一覧取得APIのレスポンス
  required:
    - data
    - meta
  properties:
    data:
      type: array
      items:
        $ref: "#/Sake"
    meta:
      allOf:
        - $ref: "./common.yaml#/SakeListMeta"

SakeTag:
  type: object
  required:
    - id
    - tag
  properties:
    id:
      type: string
      format: uuid
    tag:
      type: string
      maxLength: 50

SakeDetail:
  type: object
  description: お酒の詳細情報
  required:
    - id
    - name
    - category
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
      format: uuid
    name:
      type: string
      maxLength: 50
    phonetic:
      type: string
      nullable: true
      maxLength: 100
    category:
      $ref: "#/SakeCategory"
    alcoholPercentage:
      type: number
      format: float
      nullable: true
      minimum: 0
      maximum: 100
    volumeMax:
      type: integer
      format: int32
      nullable: true
      minimum: 1
    volumeRemain:
      type: integer
      format: int32
      nullable: true
      minimum: 0
      maximum: 100
    region:
      type: string
      nullable: true
      maxLength: 100
    price:
      type: integer
      format: int32
      nullable: true
      minimum: 0
    memo:
      type: string
      nullable: true
      maxLength: 500
    tags:
      type: array
      items:
        $ref: "#/SakeTag"
    images:
      type: array
      items:
        $ref: "#/SakeImage"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

CreateSakeRequest:
  type: object
  description: 在庫登録時に送信するお酒情報
  required:
    - name
    - category
  properties:
    name:
      type: string
      maxLength: 50
    phonetic:
      type: string
      nullable: true
      maxLength: 100
    category:
      $ref: "#/SakeCategory"
    alcoholPercentage:
      type: number
      format: float
      nullable: true
      minimum: 0
      maximum: 100
    volumeMax:
      type: integer
      format: int32
      nullable: true
      minimum: 1
    volumeRemain:
      type: integer
      format: int32
      nullable: true
      minimum: 0
      maximum: 100
    region:
      type: string
      nullable: true
      maxLength: 100
    price:
      type: integer
      format: int32
      nullable: true
      minimum: 0
    memo:
      type: string
      nullable: true
      maxLength: 500
    tags:
      type: array
      items:
        type: string
        maxLength: 50
    imageKeys:
      type: array
      description: 表示順で指定する画像キー配列
      items:
        type: string

UpdateSakeRequest:
  allOf:
    - $ref: "#/CreateSakeRequest"

CreateSakeResponse:
  type: object
  description: 在庫登録APIのレスポンス
  required:
    - data
  properties:
    data:
      allOf:
        - $ref: "#/Sake"
