openapi: 3.0.3
info:
  title: Sake Hack Backend API
  version: 2.0.0
  description: |
    Sake Hack Backend API (v2)
    実装（internal/features/sake/presentation）に準拠した仕様。
servers:
  - url: http://localhost:8080/api
    description: Local development server

tags:
  - name: sakes
    description: 酒関連API
  - name: stocks
    description: 在庫管理API

paths:
  /sakes:
    $ref: "./paths/sakes.yaml"
  /sakes/{id}:
    $ref: "./paths/sakeDetail.yaml"
  /stocks:
    $ref: "./paths/stocks.yaml"
  /stocks/{id}:
    $ref: "./paths/stockDetail.yaml"

components:
  parameters:
    Offset:
      $ref: "./components/parameters/common.yaml#/Offset"
    Limit:
      $ref: "./components/parameters/common.yaml#/Limit"
    TypeId:
      $ref: "./components/parameters/common.yaml#/TypeId"
    BreweryId:
      $ref: "./components/parameters/common.yaml#/BreweryId"
    SakeId:
      $ref: "./components/parameters/common.yaml#/SakeId"
    StockId:
      $ref: "./components/parameters/common.yaml#/StockId"

  responses:
    BadRequest:
      $ref: "./components/responses/common.yaml#/BadRequest"
    NotFound:
      $ref: "./components/responses/common.yaml#/NotFound"
    InternalServerError:
      $ref: "./components/responses/common.yaml#/InternalServerError"

  schemas:
    SakeCategory:
      $ref: "./components/schemas/sake.yaml#/SakeCategory"
    APIError:
      $ref: "./components/schemas/common.yaml#/APIError"
    ErrorResponse:
      $ref: "./components/schemas/common.yaml#/ErrorResponse"
    SakeListMeta:
      $ref: "./components/schemas/common.yaml#/SakeListMeta"
    Sake:
      $ref: "./components/schemas/sake.yaml#/Sake"
    ListSakesResponse:
      $ref: "./components/schemas/sake.yaml#/ListSakesResponse"
    SakeKind:
      $ref: "./components/schemas/sake.yaml#/SakeKind"
    Brewery:
      $ref: "./components/schemas/sake.yaml#/Brewery"
    SakeName:
      $ref: "./components/schemas/sake.yaml#/SakeName"
    DrinkStyle:
      $ref: "./components/schemas/sake.yaml#/DrinkStyle"
    SakeDetail:
      $ref: "./components/schemas/sake.yaml#/SakeDetail"
    CreateSakeRequest:
      $ref: "./components/schemas/sake.yaml#/CreateSakeRequest"
    UpdateSakeRequest:
      $ref: "./components/schemas/sake.yaml#/UpdateSakeRequest"
    CreateSakeResponse:
      $ref: "./components/schemas/sake.yaml#/CreateSakeResponse"
